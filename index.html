<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NutriBox Links</title>
<style>
  :root{
    color-scheme: light only;
    --bg:#F5F8F1;
    --bg-2:#EDF3E6;
    --surface:#FFFFFF;
    --ink:#22261F;
    --ink-soft:#5B6355;
    --green:#4E9A38;
    --green-deep:#357224;
    --green-light:#8AC950;
    --border:rgba(34,38,31,0.10);
    --shadow:0 1px 2px rgba(34,38,31,0.06), 0 10px 30px -12px rgba(34,38,31,0.18);
    --fb:#1877F2;
    --ig-a:#F58529;
    --ig-b:#DD2A7B;
    --ig-c:#8134AF;
    --wa:#25D366;
  }

  *{box-sizing:border-box;}
  html,body{ background:#FFFFFF; }
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(900px 520px at 15% -10%, var(--bg-2), transparent 60%),
      radial-gradient(760px 480px at 110% 10%, var(--bg-2), transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Tahoma,sans-serif;
    font-size:17px;
    display:flex;
    justify-content:center;
    padding-block: 56px 48px;
  }
  .wrap{
    width:100%;
    max-width:480px;
    padding-inline:24px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .leafmark{
    position:relative;
    width:116px;height:116px;
    display:flex;align-items:center;justify-content:center;
  }
  .leafmark img{
    width:100%;height:100%;object-fit:contain;
    filter: drop-shadow(0 6px 16px rgba(78,154,56,0.28));
  }

  h1.name{
    font-family:'Poppins','Inter',sans-serif;
    font-weight:600;
    font-size:32px;
    letter-spacing:0.2px;
    margin:22px 0 6px;
    display:flex; align-items:baseline; gap:2px;
  }
  h1.name .nutri{color:var(--green);}
  h1.name .box{color:var(--ink);}

  p.tagline{
    margin:0 0 8px;
    font-size:17px;
    color:var(--ink-soft);
    text-align:center;
    line-height:1.65;
    max-width:360px;
  }

  .pill{
    margin-top:10px;
    display:inline-flex;
    align-items:center;
    gap:7px;
    font-size:14px;
    font-weight:600;
    letter-spacing:0.3px;
    color:var(--green-deep);
    background:color-mix(in srgb, var(--green) 14%, transparent);
    border:1px solid color-mix(in srgb, var(--green) 30%, transparent);
    padding:7px 16px;
    border-radius:999px;
  }
  .pill svg{width:14px;height:14px;flex:none;}

  .links{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:16px;
    margin-top:36px;
  }

  a.linkbtn{
    position:relative;
    display:flex;
    align-items:center;
    gap:16px;
    width:100%;
    padding:19px 22px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:18px;
    box-shadow:var(--shadow);
    text-decoration:none;
    color:var(--ink);
    overflow:hidden;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  a.linkbtn:active{ transform:scale(0.98); }
  a.linkbtn:hover{ border-color:color-mix(in srgb, var(--green) 45%, var(--border)); }

  a.linkbtn .rail{
    position:absolute; inset-block:0; inset-inline-start:0; width:5px;
  }
  .rail-fb{background:var(--fb);}
  .rail-ig{background:linear-gradient(180deg,var(--ig-a),var(--ig-b),var(--ig-c));}
  .rail-wa{background:var(--wa);}

  .icon{
    flex:none;
    width:52px;height:52px;
    border-radius:14px;
    display:flex;align-items:center;justify-content:center;
    color:#fff;
  }
  .icon svg{width:26px;height:26px;}
  .icon-fb{background:var(--fb);}
  .icon-ig{background:linear-gradient(135deg,var(--ig-a),var(--ig-b),var(--ig-c));}
  .icon-wa{background:var(--wa);}

  .linktext{ display:flex; flex-direction:column; gap:3px; flex:1; min-width:0;}
  .linktext .t1{font-weight:600; font-size:18px;}
  .linktext .t2{font-size:14.5px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  .go{ flex:none; color:var(--ink-soft); opacity:.55; }
  .go svg{width:19px;height:19px;}
  [dir="rtl"] .go svg{ transform:scaleX(-1); }

  .divider{
    width:100%;
    display:flex;align-items:center;gap:10px;
    margin:36px 0 22px;
    color:var(--ink-soft);
    font-size:13px;
    letter-spacing:.4px;
  }
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border);}

  .cta{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    padding:18px 22px;
    border-radius:18px;
    background:linear-gradient(135deg, var(--green), var(--green-deep));
    color:#fff;
    text-decoration:none;
    font-weight:600;
    font-size:17.5px;
    box-shadow:0 10px 24px -10px color-mix(in srgb, var(--green) 70%, transparent);
  }
  .cta svg{width:22px;height:22px;}

  footer{
    margin-top:40px;
    text-align:center;
    color:var(--ink-soft);
    font-size:13.5px;
    line-height:1.8;
  }
  footer .brand{color:var(--green);font-weight:600;}
</style>
</head>
